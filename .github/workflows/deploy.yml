name: Deploy Daily Brief

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Copy data files to dist
        run: |
          cp stories.json dist/
          cp stories.fallback.json dist/
          [ -f paper_stories.json ] && cp paper_stories.json dist/ || true
          cp _headers dist/
          # manifest.json, icons, favicon and sw.js live in public/ and are copied by Vite as-is
          # Serve src/data/ at /daily-brief/src/data/ so runtime fetches work
          mkdir -p dist/src/data
          cp src/data/*.json dist/src/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
