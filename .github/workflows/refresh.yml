name: Refresh Daily Brief

on:
  schedule:
    # 06:00, 12:00, 18:00 IST = 00:30, 06:30, 12:30 UTC
    - cron: "30 0 * * *"
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"
  # Manual trigger via Actions tab or PAT dispatch from the Settings sheet
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Fetch feeds
        id: fetch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          python fetch_stories.py 2>&1 | tee fetch-log.txt

      - name: Validate stories.json
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open('stories.json'))
          assert d.get('editionDate'), 'Missing editionDate'
          total = sum(len(v) for v in d['sections'].values())
          hero  = d.get('heroStoryId', '')
          per_section = ', '.join(f"{k}: {len(v)}" for k, v in d['sections'].items())
          print(f'Edition : {d["editionDate"]}')
          print(f'Hero    : {hero or "(none)"}')
          print(f'Stories : {total} total  [{per_section}]')
          if total == 0:
              print('WARNING: 0 stories — this may be the fallback edition.')
          EOF

      - name: Generate per-story annotations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-annotations.mjs

      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-briefing.mjs

      - name: Fetch market data
        run: node scripts/fetch-markets.mjs

      - name: Update meta
        run: node scripts/update-meta.mjs

      - name: Commit and push
        run: |
          git config user.name  "daily-brief-bot"
          git config user.email "bot@daily-brief.local"
          git add stories.json fetch-log.txt src/data/meta.json src/data/briefing.json src/data/markets.json
          git diff --cached --quiet && echo "No changes to commit." || \
            git commit -m "chore: refresh $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git pull --rebase origin main
          git push
