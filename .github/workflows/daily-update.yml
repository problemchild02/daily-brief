name: Daily Brief — Auto-Update

on:
  schedule:
    # 00:30 UTC = 06:00 AM IST
    - cron: "30 0 * * *"
  # Manual trigger: Actions tab → select workflow → "Run workflow" button
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch RSS stories
        run: python fetch_stories.py

      - name: Validate stories.json
        run: |
          python -c "
          import json, sys
          d = json.load(open('stories.json'))
          assert d.get('editionDate'), 'Missing editionDate'
          total = sum(len(v) for v in d['sections'].values())
          hero = d.get('heroStoryId', '')
          if not hero:
              print(f'WARN: heroStoryId is empty (all feeds may have been empty/blocked)')
          print(f'Valid — {total} stories, edition {d[\"editionDate\"]}, hero={hero or \"(none)\"}')"

      - name: Commit updated stories.json
        run: |
          git config user.name  "daily-brief-bot"
          git config user.email "bot@daily-brief.local"
          git add stories.json
          git diff --cached --quiet && echo "No changes to commit." || \
            git commit -m "chore: stories auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
