name: Daily Brief — Auto-Update

on:
  schedule:
    # 00:30 UTC = 06:00 AM IST
    - cron: "30 0 * * *"
  # Manual trigger: Actions tab → select workflow → "Run workflow" button
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch RSS stories + AI summaries
        id: fetch
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -o pipefail
          python fetch_stories.py 2>&1 | tee fetch-log.txt

      - name: Validate stories.json
        id: validate
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open('stories.json'))
          assert d.get('editionDate'), 'Missing editionDate'
          total = sum(len(v) for v in d['sections'].values())
          hero  = d.get('heroStoryId', '')
          per_section = ', '.join(f"{k}: {len(v)}" for k, v in d['sections'].items())
          print(f'Edition : {d["editionDate"]}')
          print(f'Hero    : {hero or "(none)"}')
          print(f'Stories : {total} total  [{per_section}]')
          if total == 0:
              print('ERROR: 0 stories — this is the fallback edition or something is wrong.')
              print('Committing anyway so the site shows the fallback notice rather than staying blank.')
          EOF

      - name: Commit updated stories.json
        run: |
          git config user.name  "daily-brief-bot"
          git config user.email "bot@daily-brief.local"
          git add stories.json fetch-log.txt
          git diff --cached --quiet && echo "No changes to commit." || \
            git commit -m "chore: stories auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
