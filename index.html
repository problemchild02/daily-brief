<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Daily Brief</title>
<meta name="theme-color" content="#faf8f4" />
<link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="header-brand">
      <h1 class="site-title">The Daily Brief</h1>
<p class="site-subtitle">Your personal legal, regulatory &amp; business newsroom</p>
    </div>

    <div class="header-actions" aria-label="Display controls">
      <button class="icon-btn" id="btn-archive" type="button" title="Archive" aria-label="Open archive">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <polyline points="21 8 21 21 3 21 3 8"></polyline>
          <rect x="1" y="3" width="22" height="5"></rect>
          <line x1="10" y1="12" x2="14" y2="12"></line>
        </svg>
      </button>

      <button class="icon-btn" id="btn-reading" type="button" title="Reading mode" aria-label="Toggle reading mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
      </button>

      <button class="icon-btn" id="btn-focus" type="button" title="Focus mode" aria-label="Toggle focus mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
      </button>

      <button
        class="icon-btn"
        id="btn-theme"
        type="button"
        title="Toggle theme"
        aria-label="Switch to dark theme"
      >
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>

        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <nav
    class="tab-bar"
    aria-label="News sections"
    role="tablist"
  >
    <button
      class="tab active"
      id="tab-all"
      type="button"
      role="tab"
      aria-selected="true"
      aria-controls="panel-all"
      tabindex="0"
      data-target="all"
    >
      All Sections
    </button>

    <button
      class="tab"
      id="tab-legal"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="panel-legal"
      tabindex="-1"
      data-target="legal"
    >
      Legal &amp; Regulatory
    </button>
  </nav>
<main class="main-content" id="main-content">
  <section
    id="panel-all"
    class="tab-panel"
    role="tabpanel"
    aria-labelledby="tab-all"
    tabindex="0"
    data-panel="all"
  >
    <section class="hero-section" data-section="hero">
      <p class="section-eyebrow">Front Page</p>
      <div id="hero-container"></div>
    </section>

    <section class="rail-section" data-section="legal">
      <div class="rail-header">
        <div class="rail-title-group">
          <span class="category-dot" aria-hidden="true"></span>
          <h2 class="rail-heading">Legal &amp; Regulatory</h2>
        </div>

        <button class="btn-refresh" type="button" title="Refresh section" aria-label="Refresh Legal and Regulatory">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          Refresh
        </button>
      </div>

      <div class="card-grid" id="legal-grid"></div>
    </section>
  </section>

  <section
    id="panel-legal"
    class="tab-panel"
    role="tabpanel"
    aria-labelledby="tab-legal"
    tabindex="0"
    data-panel="legal"
    hidden
  >
    <section class="rail-section rail-section-single">
      <div class="rail-header">
        <div class="rail-title-group">
          <span class="category-dot" aria-hidden="true"></span>
          <h2 class="rail-heading">Legal &amp; Regulatory</h2>
        </div>
      </div>

      <div class="card-grid" id="legal-grid-panel"></div>
    </section>
  </section>
</main>
  <footer class="site-footer">
    <p>The Daily Brief &nbsp;·&nbsp; v0.1 &nbsp;·&nbsp; Static edition</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
